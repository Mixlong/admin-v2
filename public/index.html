<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="renderer" content="webkit">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="<%= BASE_URL %>favicon.ico">
  <link rel="stylesheet" type="text/css" href="//at.alicdn.com/t/font_2293507_2p9q9hn3609.css">
  </link>
  <title>
    <%= webpackConfig.name %>
  </title>
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0px;
      padding: 0px;
    }

    #loader-wrapper {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loader-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      animation: stageFade 0.8s ease-out both;
    }

    .loader-brand {
      font-size: clamp(56px, 8vw, 96px);
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #0f172a;
    }

    .loader-pulse {
      display: flex;
      gap: 14px;
    }

    .loader-pulse span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #3b82f6;
      opacity: 0.35;
      animation: pulse 1.6s infinite ease-in-out;
    }

    .loader-pulse span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loader-pulse span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.25;
        transform: scale(1);
      }
      50% {
        opacity: 0.9;
        transform: scale(1.4);
      }
    }

    @keyframes stageFade {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    body.loaded #loader-wrapper {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }

    @media (prefers-color-scheme: dark) {
      .loader-brand {
        color: #f8fafc;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader-pulse span {
        animation: none;
        opacity: 0.6;
      }
    }
  </style>
</head>

<body>
  <div id="loader-wrapper">
    <div class="loader-stage">
      <div class="loader-brand">Digiwise</div>
      <div class="loader-pulse">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>
  <div id="app"></div>
</body>

</html>
