<!DOCTYPE html><html><head><meta charset=utf-8><meta http-equiv=X-UA-Compatible content="IE=edge,chrome=1"><meta name=renderer content=webkit><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,viewport-fit=cover"><meta name=referrer content=no-referrer><link rel=icon href=favicon.ico><link rel=stylesheet type=text/css href=//at.alicdn.com/t/font_2293507_2p9q9hn3609.css><title></title><style>html,
    body,
    #app {
      height: 100%;
      margin: 0px;
      padding: 0px;
    }

    #loader-wrapper {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      z-index: 999999;
      /*background: radial-gradient(
          circle at 50% 30%,
          rgba(59, 130, 246, 0.12),
          transparent 45%
        ),
        #f8fafc;*/
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* From Uiverse.io by KSAplay */
    .loader {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 5px;
    }

    .loading-text {
      color: #0f172a;
      font-size: 18pt;
      font-weight: 600;
      margin-left: 0;
      text-align: center;
      line-height: 1;
    }

    .dot {
      margin-left: 3px;
      animation: blink 1.5s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: 0.3s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.6s;
    }

    .loading-bar-background {
      --height: 30px;
      display: flex;
      align-items: center;
      box-sizing: border-box;
      padding: 5px;
      width: 200px;
      height: var(--height);
      background-color: rgba(15, 23, 42, 0.12);
      box-shadow: inset 0 2px 6px rgba(15, 23, 42, 0.15);
      border-radius: calc(var(--height) / 2);
    }

    .loading-bar {
      position: relative;
      display: flex;
      justify-content: center;
      flex-direction: column;
      --height: 20px;
      width: 100%;
      height: var(--height);
      overflow: hidden;
      background: transparent;
      border-radius: calc(var(--height) / 2);
    }

    .loading-bar-fill {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        0deg,
        rgba(96, 165, 250, 1) 0%,
        rgba(59, 130, 246, 1) 100%
      );
      border-radius: inherit;
      width: 100%;
      height: 100%;
      transform: translateX(-100%);
      will-change: transform;
      animation: loading 4s ease-out infinite;
    }

    .white-bars-container {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 18px;
      border-radius: inherit;
    }

    .white-bar {
      background: linear-gradient(
        -45deg,
        rgba(255, 255, 255, 1) 0%,
        rgba(255, 255, 255, 0) 70%
      );
      width: 10px;
      height: 45px;
      opacity: 0.3;
      rotate: 45deg;
    }

    @keyframes loading {
      0% {
        transform: translateX(-100%);
      }
      80% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(0);
      }
    }

    @keyframes blink {
      0%, 100% {
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
    }

    body.loaded #loader-wrapper {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }

    @media (prefers-color-scheme: dark) {
      #loader-wrapper {
        background: radial-gradient(
            circle at 50% 30%,
            rgba(59, 130, 246, 0.2),
            transparent 45%
          ),
          #020617;
      }
    }</style><link href=css/chunk-elementUI.636ec213.css rel=stylesheet><link href=css/chunk-vendors.b702fbbb.css rel=stylesheet><link href=css/app.b381fcd9.css rel=stylesheet></head><body><div id=loader-wrapper><div class=loader><div class=loading-text>Digiwise<span class=dot>.</span><span class=dot>.</span><span class=dot>.</span></div><div class=loading-bar-background><div class=loading-bar><div class=loading-bar-fill></div><div class=white-bars-container><div class=white-bar></div><div class=white-bar></div><div class=white-bar></div><div class=white-bar></div><div class=white-bar></div><div class=white-bar></div><div class=white-bar></div><div class=white-bar></div><div class=white-bar></div><div class=white-bar></div></div></div></div></div></div><div id=app></div><script src=js/runtime.4a4b5242.js></script><script src=js/chunk-elementUI.150cf31e.js></script><script src=js/chunk-vendors.028127af.js></script><script src=js/app.a241c463.js></script></body></html>
